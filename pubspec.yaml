name: workmanager_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.4.0
  video_player: ^2.8.1
  cupertino_icons: ^1.0.8
  mysql_client: ^0.0.27
  provider: ^6.1.5+1
  window_manager: ^0.5.1
  intl: ^0.20.2 
  flutter_localizations:
    sdk: flutter
  table_calendar: ^3.1.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: ^2.4.0
  flutter_lints: ^6.0.0

# 💡 ここから設定セクション（一番左から書く）

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/app_icon_windows.png"
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#0F1115" 
  adaptive_icon_foreground: "assets/app_icon.png"

flutter_native_splash:
  color: "#0F1115"
  image: assets/app_icon.png
  fullscreen: true
  # Android 12以降でアイコンが小さくなるのを防ぐための設定
  android_12:
    image: assets/app_icon.png
    color: "#0F1115"
    icon_background_color: "#0F1115"

flutter:
  assets:
    - assets/videos/splash_logo.mp4
    - assets/app_icon.png
    - assets/mascot.png
    - assets/mascot_fight.jpg
    - assets/mascot_good_pace.jpg
    - assets/mascot_excellent.jpg
    - assets/mascot_kansai.jpg
    - assets/mascot_coach.jpg
    - assets/mascot_butler.jpg
    - assets/menu_personal_stats.jpg
    - assets/menu_unit_cleaning.jpg
    - assets/menu_data_edit.jpg
    - assets/menu_data_view.jpg
    - assets/menu_goal_list.jpg
    - assets/menu_schedule.jpg
    - assets/menu_productivity.jpg
    - assets/menu_seating_chart.jpg
    - assets/menu_database_settings.jpg
    - assets/menu_display_settings.jpg
    - assets/frame_wood.png
    - assets/frame_iron.png
    - assets/frame_bronze.png
    - assets/frame_silver.png
    - assets/frame_gold.png
    - assets/nameplate_wood.png
    - assets/nameplate_iron.png
    - assets/nameplate_bronze.png
    - assets/nameplate_silver.png
    - assets/nameplate_gold.png
    - assets/nameplate_gold_wide.png
    - assets/bg_glassmorphism.jpg
    - assets/bg_tech_abstract.jpg
  uses-material-design: true